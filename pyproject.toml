[project]
name = "mercado-do-ponto-analytics"
version = "4.0.0"
description = "Production retail analytics platform with orchestration, PostgreSQL, observability and Power BI"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.11.2",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
