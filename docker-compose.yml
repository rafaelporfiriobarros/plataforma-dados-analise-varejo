services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-mercado_analytics}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mercado_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 15
  pipeline:
    profiles:
      - manual
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mercado_analytics}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      LOAD_TO_POSTGRES: "true"
      INCREMENTAL_LOAD: "true"
    volumes: ["./data:/app/data"]
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres: {condition: service_healthy}
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mercado_analytics}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PYTHONPATH: /opt/project/src
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
volumes:
  postgres_data:
